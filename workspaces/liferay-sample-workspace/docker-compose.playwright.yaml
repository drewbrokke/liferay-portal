services:
    liferay:
        environment:
            LIFERAY_BROWSER_PERIOD_LAUNCHER_PERIOD_URL: ""
            LIFERAY_CAPTCHA_PERIOD_ENFORCE_PERIOD_DISABLED: "true"
            LIFERAY_COMPANY_PERIOD_SECURITY_PERIOD_STRANGERS_PERIOD_VERIFY: "false"
            LIFERAY_CONFIGURATION_PERIOD_OVERRIDE_PERIOD_COM_PERIOD_LIFERAY_PERIOD_CAPTCHA_PERIOD_CONFIGURATION_PERIOD__UPPERCASEC_APTCHA_UPPERCASEC_ONFIGURATION_UNDERLINE_MAX_UPPERCASEC_HALLENGES: I"-1"
            LIFERAY_ENTERPRISE_PERIOD_PRODUCT_PERIOD_ENTERPRISE_PERIOD_SEARCH_PERIOD_ENABLED: "false"
            LIFERAY_PASSWORDS_PERIOD_DEFAULT_PERIOD_POLICY_PERIOD_CHANGE_PERIOD_REQUIRED: "false"
            LIFERAY_SETUP_PERIOD_WIZARD_PERIOD_ENABLED: "false"
            LIFERAY_TERMS_PERIOD_OF_PERIOD_USE_PERIOD_REQUIRED: "false"
            LIFERAY_USERS_PERIOD_REMINDER_PERIOD_QUERIES_PERIOD_ENABLED: "false"
            LIFERAY_VIRTUAL_PERIOD_HOSTS_PERIOD_DEFAULT_PERIOD_SITE_PERIOD_NAME: ""
            LIFERAY_VIRTUAL_PERIOD_HOSTS_PERIOD_VALID_PERIOD_HOSTS: "*"
        image: ${LIFERAY_IMAGE}
        volumes:
            -   ./playwright/env:/mnt/liferay/files:ro