## DO NOT EDIT THIS FILE.
##
## To update the properties of this file, create a separate properties file
## named "build.${user.name}.properties" with the properties to overwrite.
##

##
## Baseline JAR
##

    baseline.jar.bnddir.name=.bnd

    #baseline.jar.report.level=diff
    #baseline.jar.report.level=off
    baseline.jar.report.level=persist
    #baseline.jar.report.level=standard

    baseline.jar.report.only.dirty.packages=true
    baseline.jar.reports.dir.name=baseline-reports
    baseline.jar.url=https://repository-cdn.liferay.com/nexus/content/repositories/liferay-public-releases

    -baseline=
    -baselinerepo=remoterepo
    -fixupmessages: "While setting properties ...";is:=ignore
    -metatype: *
    -plugin=\
        aQute.bnd.deployer.repository.LocalIndexedRepo;\
            local=${project.dir}/.bnd/localrepo;\
            name=localrepo;\
            phase=any;\
            type=R5,\
        aQute.bnd.deployer.repository.FixedIndexedRepo;\
            cache=${project.dir}/.bnd/bndtoolsrepo;\
            locations='https://github.com/bndtools/bundle-hub/raw/master/index.xml.gz';\
            name=bndtoolsrepo;\
            phase=any;\
            type=R5,\
        aQute.bnd.deployer.repository.FixedIndexedRepo;\
            cache=${project.dir}/.bnd/remoterepo;\
            locations='http://obr.liferay.com/r5/liferay-portal/index.xml.gz';\
            name=remoterepo;\
            phase=any;\
            type=R5
    -pluginpath=${project.dir}/lib/development/bnd-repository.jar
    -releaserepo=localrepo

##
## BND Test
##

    -resolve.effective=active
    -runee=JavaSE-1.6
    -runfw=org.apache.felix.framework
    -runvm=-ea

##
## Build
##

    build.binaries.cache.dir=../${build.binaries.cache.repository.name}
    build.binaries.cache.repository.name=liferay-binaries-cache-2020
    build.binaries.cache.url=https://github.com/liferay/${build.binaries.cache.repository.name}.git
    build.binaries.gradle.file=gradle-8.5.LIFERAY-PATCHED-1-bin.zip
    build.binaries.gradle.url=https://releases-cdn.liferay.com/tools/gradle/${build.binaries.gradle.file}
    build.bnd.print.enabled=false

    #
    # Set the default version for "com.liferay.portal" dependencies at compile
    # time so the artifact can be deployed on previously released bundles. Leave
    # the property empty to compile against the source.
    #
    build.compat.version.com.liferay.portal.impl=
    build.compat.version.com.liferay.portal.kernel=
    build.compat.version.com.liferay.util.bridges=
    build.compat.version.com.liferay.util.java=
    build.compat.version.com.liferay.util.taglib=

    #
    # Set the module directories to exclude when running "ant all".
    #
    build.exclude.dirs=

    #
    # Set the Git clean command used when running "ant all" or "ant clean".
    #
    build.git.clean.command=git clean -dfq \
        -e '!**/*.iml' \
        -e '!**/.classpath' \
        -e '!**/.project' \
        -e '!**/.settings' \
        -e '!*.*.properties' \
        -e '!.gradle' \
        -e '!.gradle/**/*' \
        -e '!.idea' \
        -e '!/modules/node_modules' \
        -e '!/modules/node_modules_cache' \
        -e '!/modules/private/node_modules_cache' \
        -e '!/sql/*.*.properties' \
        -e '!/tools/gradle-*-bin.zip' \
        -e '!lib/**/*' \
        -e '!modules/node_modules/**/*' \
        -e '!portal-impl/src/portal-*.properties' \
        -e '!portal-impl/src/system-*.properties' \
        \
        -X .

