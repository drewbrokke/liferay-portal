clean {
	ext {
		cleanDeployed = false
	}
}

dependencies {
	compile group: "biz.aQute.bnd", name: "aQute.libg", version: "5.2.0"
	compile group: "biz.aQute.bnd", name: "biz.aQute.bnd.gradle", version: "5.2.0"
	compile group: "org.ow2.asm", name: "asm", version: "5.1"

	compileOnly group: "com.liferay.portal", name: "com.liferay.portal.impl", version: "default"
	compileOnly group: "org.apache.ant", name: "ant", transitive: false, version: "1.10.11"

	testCompile project(":core:petra:petra-io")
	testCompile project(":core:petra:petra-string")
}

liferay {
	deployDir = file("../../../lib/development")
}

updateFileVersions {
	match(/com\.liferay\.ant\.bnd=com\.liferay:com\.liferay\.ant\.bnd:(\d.+)/, "../../../lib/development/dependencies.properties")
}