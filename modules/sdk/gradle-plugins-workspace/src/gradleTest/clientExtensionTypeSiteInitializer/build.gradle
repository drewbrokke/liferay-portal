task runGradleTest

runGradleTest {
	dependsOn ":site-initializer-cx:createClientExtensionConfig"

	doLast {
		Project siteInitializerCxProject = project(":site-initializer-cx")

		File cxBuildDir = siteInitializerCxProject.file("${siteInitializerCxProject.buildDir}/liferay-client-extension-build")

		File siteInitializerZipFile = siteInitializerCxProject.file("${cxBuildDir}/site-initializer.zip")

		assert siteInitializerZipFile.exists()

		FileTree siteInitializerZipTree = zipTree(siteInitializerZipFile)

		assert !siteInitializerZipTree.isEmpty()

		File liferayPluginPackagePropertiesFile = siteInitializerCxProject.file("${cxBuildDir}/WEB-INF/liferay-plugin-package.properties")

		assert liferayPluginPackagePropertiesFile.exists()

		assert liferayPluginPackagePropertiesFile.text.contains("Liferay-Client-Extension-Site-Initializer=site-initializer/")

		File dockerfileFile = siteInitializerCxProject.file("${cxBuildDir}/Dockerfile")

		assert dockerfileFile.exists()

		assert dockerfileFile.text.contains("COPY /site-initializer /opt/liferay/site-initializer")
	}
}