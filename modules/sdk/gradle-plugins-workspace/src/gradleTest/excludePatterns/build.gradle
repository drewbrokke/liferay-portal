task runGradleTest

buildscript {
	println "FIRST!!!!!"
}

ext.liferay.workspace.dir.excludes.globs="modules/**/bar-*"
ext {
	expectedExcludedProjects = [
		":modules:bar:bar-api",
		":modules:bar:bar-service",
	]
}

runGradleTest {
	doLast {
		allprojects {
			def expectedHasEnabledTask = true
			if (expectedExcludedProjects.any { it == path }) {
				expectedHasEnabledTask = false;
			}

			println path
			assert expectedHasEnabledTask == tasks.any { it.enabled }
		}
	}
}
