site-initializer-cx-foo:
    name: foo site initializer
    oAuthApplicationHeadlessServer: oauth-cx
    siteExternalReferenceCode: fooExternalReferenceCode
    siteName: fooSiteName
    type: siteInitializer
site-initializer-cx-bar:
    name: bar site initializer
    oAuthApplicationHeadlessServer: oauth-cx
    siteExternalReferenceCode: barExternalReferenceCode
    siteName: barSiteName
    type: siteInitializer
oauth-cx:
    .serviceAddress: localhost:8080
    .serviceScheme: http
    name: OAuth CX
    scopes:
        - Liferay.Headless.Site.everything
    type: oAuthApplicationHeadlessServer