task runGradleTest

String[] taskPaths = [
	":no-oauth-cx:createClientExtensionConfig"
]

gradle.taskGraph.afterTask {
	Task task, TaskState taskState ->

	if (taskPaths.contains(task.path)) {
		assert taskState.failure != null : "expected task ${task.path} to fail"

		String errorMessage = taskState.failure.cause.message;

		assert errorMessage.contains("An OAuth client extension was not found, but is required.")

		println "FOUND EXPECTED ERROR MESSAGE FOR TASK ${task.path}"
		println errorMessage

		taskState.failure = null
	}
}

runGradleTest {
	dependsOn taskPaths
}