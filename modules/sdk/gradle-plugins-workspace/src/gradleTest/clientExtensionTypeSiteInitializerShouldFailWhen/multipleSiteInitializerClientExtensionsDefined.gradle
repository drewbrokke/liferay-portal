task runGradleTest

LogListener logListener = new LogListener()

project(":multiple-site-initializer-client-extension") {
	it.tasks.each {
		println "TASK NAME: {}", it.name
	}
}

runGradleTest {
	dependsOn ":multiple-site-initializer-client-extension:createClientExtensionConfig"

	doLast {
		println "DREWWASHERE: {}", logListener.log
	}
}

class LogListener implements StandardOutputListener {

	void onOutput(CharSequence charSequence) {
		log = log + charSequence
	}

	String log = ""

}