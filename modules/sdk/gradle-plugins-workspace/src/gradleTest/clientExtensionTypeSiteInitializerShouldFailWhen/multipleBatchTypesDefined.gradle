task runGradleTest

String[] taskPaths = [
	":mixed-batch-and-site-initializer-client-extensions:createClientExtensionConfig",
	":multiple-site-initializer-client-extensions:createClientExtensionConfig"
]

gradle.taskGraph.afterTask {
	Task task, TaskState taskState ->

	if (taskPaths.contains(task.path)) {
		assert taskState.failure != null : "expected task ${task.path} to fail"

		String errorMessage = taskState.failure.cause.message;

		assert errorMessage.contains("A client extension project must not contain more than one")

		println "FOUND EXPECTED ERROR MESSAGE FOR TASK ${task.path}"
		println errorMessage

		taskState.failure = null
	}
}

runGradleTest {
	dependsOn taskPaths
}