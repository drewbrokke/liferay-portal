task runGradleTest

repositories {
	maven {
		url "repo"
	}
}

runGradleTest {
	dependsOn updateWorkspace

	doLast {
		File file = new File(projectDir, "evergreen-marker.txt")

		assert file.exists()
		assert file.text == "updateWorkspace gradleTest fixture marker 99999999.9998."

		File nestedFile = new File(projectDir, "nested/evergreen-marker.txt")

		assert !nestedFile.exists()
	}
}

updateWorkspace {
	toVersion = "99999999.9998"
}