import groovy.json.JsonGenerator
import groovy.json.JsonOutput
import groovy.json.JsonSlurper

import java.util.regex.Pattern

task generateInstanceSettingsJsonSchema
task testSchemaFileUpToDate

String defaultSchemaFilePath = "src/main/resources/schemas/client-extension-type-instance-settings.schema.json"

Map<String, String> schemaDataTypes = [
		'LocalizedValuesMap': 'object',
		'String'            : 'string',
		'String[]'          : 'array',
		'boolean'           : 'boolean',
		'float'             : 'number',
		'int'               : 'number',
		'long'              : 'number',
]

class AttributeDef {
	Object defaultValue
	String description
	Number max
	Number min
	String title
	String[] optionLabels
	Object[] optionValues
	boolean requiredInput
	boolean required = true
	Boolean deprecated
	String type
	String name

	boolean isArray() {
		return type == 'array'
	}
	boolean isBoolean() {
		return type == 'boolean'
	}
	boolean isNumber() {
		return type == 'number'
	}
	boolean isObject() {
		return type == 'object'
	}
	boolean isString() {
		return type == 'string'
	}
}

class ObjectDef {
	List<AttributeDef> attributeDefs = []
	String pid
	String category
	String description
	String title
	String interfaceName
}

Closure<Float> stringToNumber = {
	String s ->

	if (!s) {
		return 0
	}

	if (s.contains(".")) {
		return Float.parseFloat(s)
	}

	return Integer.parseInt(s)
}

Closure<Object> withMatcher = {
	String s, Object o, Pattern pattern, Closure fn ->

	def matcher = s =~ pattern

	if (!matcher) {
		return
	}

	for (final def metaPropertyValue in o.metaPropertyValues) {
		String value;

		try {
			value = matcher.group(metaPropertyValue.name)
		}
		catch (Exception ignored) {
			continue
		}

		if (metaPropertyValue.type in [Object[].class, String[].class]) {
			metaPropertyValue.value = value.replaceAll('[ "]', "").split(",")
		} else if (metaPropertyValue.type == Number.class) {
			metaPropertyValue.value = stringToNumber(value)
		} else if (metaPropertyValue.type == boolean.class) {
			metaPropertyValue.value = value == "true"
		} else if (metaPropertyValue.name == "type") {
			metaPropertyValue.value = schemaDataTypes.get(value)
		} else {
			metaPropertyValue.value = value
		}
	}

	if (fn) {
		fn.call()
	}
}

Closure<String> getProcessOutput = { ["sh", "-c", it].execute().text.trim() }

Closure<String> generateJSONString = {
	Properties languageProperties = new Properties()

	String gitTopLevel = getProcessOutput "git rev-parse --show-toplevel"

	String languagePropertiesFilePath = 'modules/apps/portal-language/portal-language-lang/src/main/resources/content/Language.properties'

	new File("${gitTopLevel}/${languagePropertiesFilePath}").withReader {languageProperties.load(it) }

	String[] configFilePaths = getProcessOutput("git -C ${gitTopLevel} grep -l 'scope = ExtendedObjectClassDefinition.Scope.(COMPANY|GROUP)' -- '*Configuration.java'").split()

	ObjectDef[] objectDefs = configFilePaths.collect {
		configFilePath ->

		ObjectDef objectDef = new ObjectDef();

		AttributeDef attributeDef = new AttributeDef()

		new File("${gitTopLevel}/${configFilePath}").readLines().each {
			line ->

			if (!objectDef.interfaceName) {
				withMatcher(line, objectDef, ~/\bid = "(?<pid>com\..+)"/, null)
				withMatcher(line, objectDef, ~/\bcategory = "(?<category>[^"]*)"/, null)
				withMatcher(line, objectDef, ~/\bdescription = "(?<description>[^"]*)"/, { objectDef.description = languageProperties.getProperty(objectDef.description) })
				withMatcher(line, objectDef, ~/\bname = "(?<title>[^"]*)"/, { objectDef.title = languageProperties.getProperty(objectDef.title) })
				withMatcher(line, objectDef, ~/public @?interface (?<interfaceName>[A-Z][A-Za-z\d]+)\b/, null)

				return
			}

			withMatcher(line, attributeDef, ~/\bdeflt = "(?<defaultValue>[^"]*)"/, null)
			withMatcher(line, attributeDef, ~/\bdescription = "(?<description>[^"]*)"/, { attributeDef.description = languageProperties.getProperty(attributeDef.description) })
			withMatcher(line, attributeDef, ~/\bmax = "(?<max>[^"]+)"/, null)
			withMatcher(line, attributeDef, ~/\bmin = "(?<min>[^"]+)"/, null)
			withMatcher(line, attributeDef, ~/\bname = "(?<title>[^"]*)"/, { attributeDef.title = languageProperties.getProperty(attributeDef.title) })
			withMatcher(line, attributeDef, ~/\boptionLabels = \{(?<optionLabels>[^{}]*)}/, null)
			withMatcher(line, attributeDef, ~/\boptionValues = \{(?<optionValues>[^{}]*)}/, null)
			withMatcher(line, attributeDef, ~/\brequiredInput = (?<requiredInput>true|false)/, null)
			withMatcher(line, attributeDef, ~/\brequired = (?<required>true|false)/, null)
			withMatcher(line, attributeDef, ~/\b(?<deprecated>@Deprecated)/, {attributeDef.deprecated = true})
			withMatcher(line, attributeDef, ~/\s+public(default)? (?<type>\w+|\S+) (?<name>\w+)\(\)/, {
				if (attributeDef.requiredInput) {
					attributeDef.required = true;
				}

				if (attributeDef.defaultValue != null) {
					if (attributeDef.isBoolean()) {
						attributeDef.defaultValue = attributeDef.defaultValue == "true"
					}
					if (attributeDef.isNumber()) {
						attributeDef.defaultValue = stringToNumber(attributeDef.defaultValue as String)
					}
				}

				if (attributeDef.optionValues && attributeDef.isNumber()) {
					attributeDef.optionValues = attributeDef.optionValues.collect { stringToNumber(it as String) }
				}

				objectDef.attributeDefs.add(attributeDef)

				attributeDef = new AttributeDef()
			})
		}

		return objectDef
	}.findAll {it.pid !== null}

	// Write the schema
	def schema = [
		oneOf: [],
		properties: [
			pid: [
				enum: []
			]
		]
	]
	objectDefs.each {objectDef ->
		def typeSchema = [
			properties: [
				pid:
					[
						const: objectDef.pid,
						description: objectDef.description,
						title: objectDef.title,
					]
			],
			required: ['pid'],
			title: objectDef.title,
			description: objectDef.description,
		]

		objectDef.attributeDefs.each { attributeDef ->
			def propertySchema = [
				default: attributeDef.defaultValue,
				deprecated: attributeDef.deprecated,
				description: attributeDef.description,
				title: attributeDef.title,
				type: attributeDef.type
			]

			if (attributeDef.isArray()) {
				propertySchema.items = [type: 'string']
			}
			if (attributeDef.isObject()) {
				propertySchema.properties = [:]
			}
			if (attributeDef.isNumber()) {
				propertySchema.max = attributeDef.max
				propertySchema.min = attributeDef.min
			}
			if (attributeDef.isString()) {
				propertySchema.maxLength = attributeDef.max
				propertySchema.minLength = attributeDef.min
			}
			if (attributeDef.optionValues) {
				if (attributeDef.isArray()) {
					propertySchema.items.enum = attributeDef.optionValues
				}
				else {
					propertySchema.enum = attributeDef.optionValues
				}
			}
			if (attributeDef.required) {
				typeSchema.required.add(attributeDef.name)
			}

			typeSchema.properties[attributeDef.name] = propertySchema
		}

		schema.oneOf.add(typeSchema)
		schema.properties.pid.enum.add(objectDef.pid)
	}

	JsonGenerator jsonGenerator = new JsonGenerator.Options()
		.excludeNulls()
		.excludeFieldsByName("contentHash", "originalClassName", "requiredInput")
		.build()

	return jsonGenerator.toJson(schema)
}

generateInstanceSettingsJsonSchema {
	outputs.upToDateWhen {
		false
	}

	doFirst {
		String schemaFilePath = project.findProperty("schemaFilePath")

		if (schemaFilePath == null) {
			schemaFilePath = defaultSchemaFilePath
		}

		file(schemaFilePath).text = JsonOutput.prettyPrint(generateJSONString()).replaceAll(" {4}", "\t")
	}
}

testSchemaFileUpToDate{
	outputs.upToDateWhen {
		false
	}

	doFirst {
		String schemaFilePath = project.findProperty("schemaFilePath")

		if (schemaFilePath == null) {
			schemaFilePath = defaultSchemaFilePath
		}

		JsonSlurper slurper = new JsonSlurper()

		assert slurper.parse(file(schemaFilePath)) == slurper.parseText(generateJSONString()) : "Schema file is out of date"
	}
}